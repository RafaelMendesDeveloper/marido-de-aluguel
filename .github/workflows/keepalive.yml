# O plano free do Supabase pausa o projeto após ~7 dias sem requisições.
# Uma consulta leve por dia mantém o projeto ativo.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve na API
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Secrets não configurados; nada a fazer."; exit 0; fi
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" "$URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
